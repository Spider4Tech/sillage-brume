name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: make
      run: make -C sillage/c
    - name: tests C natifs (construction)
      run: make -C tests/c all compression
    - name: KAT du prototype VOLE
      run: tests/c/build/vole_proto --kat
    - name: fuzzing court du vérifieur sous ASan et UBSan
      run: |
        gcc -O1 -g -march=native -fopenmp -fsanitize=address,undefined -fno-sanitize-recover=all -I sillage/c -I tests/c \
            -o tests/c/build/vole_asan tests/c/vole_proto.c sillage/c/commun.c sillage/c/brume512.c sillage/c/brume512_avx2.c -lm
        OMP_NUM_THREADS=1 tests/c/build/vole_asan --fuzz 300 1
