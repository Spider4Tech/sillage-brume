name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the C library and benchmark
      run: make -C sillage/c
    - name: Build the native test programs
      run: make -C tests/c all compression
    - name: C review checks
      run: mkdir -p resultats && tests/c/build/revue_c
    - name: Exact spectrum of H1-P / H2-P (Lemma 0)
      run: tests/c/build/h1p_fourier
    - name: VOLE prototype known-answer tests
      run: tests/c/build/vole_proto --kat
    - name: Short verifier fuzzing under ASan and UBSan
      run: |
        gcc -O1 -g -march=native -fopenmp -fsanitize=address,undefined -fno-sanitize-recover=all -I sillage/c -I tests/c \
            -o tests/c/build/vole_asan prototypes/vole/vole_proto.c sillage/c/commun.c sillage/c/brume1024.c -lm
        OMP_NUM_THREADS=1 tests/c/build/vole_asan --fuzz 300 1
    - name: Install the Python dependency
      run: python3 -m pip install -r requirements.txt
    - name: BRUME-1024q tables are those of the generator
      run: |
        gcc -O3 -march=native -fopenmp -I sillage/c -I tests/historique_v05/c_tests -I tests/historique_v05/c \
            prototypes/brume_q/b1024/gen_b1024.c sillage/c/commun.c sillage/c/brume1024.c -lm -o tests/c/build/gen_b1024
        tests/c/build/gen_b1024 /tmp/t.h /tmp/l.h
        diff <(sed -n '/#define B1_N/,/^#endif/p' /tmp/t.h | grep -v '^#endif') \
             <(sed -n '/#define B1_N/,/S-box (SPEC/p' sillage/c/brume1024_tables.h | grep -v 'S-box (SPEC' | sed '$d')
        diff <(tail -n +2 /tmp/l.h) <(tail -n +2 sillage/c/brume1024_lot.h)
    - name: BRUME-1024q (v0.6) checks on the library, with and without AVX2, and TE
      run: |
        mkdir -p resultats
        OMP_NUM_THREADS=2 tests/c/build/brume1024
        tests/c/build/brume1024_api
        tests/c/build/brume1024_api_portable
        if grep -H ': false' resultats/brume1024.json resultats/brume1024_api.json resultats/brume1024_api_portable.json; then exit 1; fi
    - name: Quick tests (KATs, TE mode, C and Python conformance, second implementation, proof checks)
      run: |
        python3 -m tests.test_fonctionnel
        python3 -m tests.test_c_impl
        python3 -m tests.test_b1024_seconde_implementation
        python3 -m tests.test_b1024_certificats
        python3 -m tests.test_bornes_preuves
    - name: Fail if any quick-test check failed
      run: |
        # the tests record their checks in resultats/<name>.json and always exit 0
        if grep -H ': false' resultats/fonctionnel.json resultats/c_impl.json resultats/b1024_seconde_implementation.json \
             resultats/b1024_certificats.json resultats/bornes_preuves.json; then exit 1; fi
    - name: Quantum bound of the hash (docs/brume1024/SPONGE_QROM.md), exhaustive on small models, with a failing witness
      run: |
        V=prototypes/brume_q/b1024/cm26_verif
        gcc -O2 $V/exhaustif.c -o tests/c/build/cm26_exhaustif
        gcc -O2 -DTEMOIN $V/exhaustif.c -o tests/c/build/cm26_temoin
        tests/c/build/cm26_exhaustif 1 3 1 0x5 0x4 0x5 0x6 3 0 3
        tests/c/build/cm26_exhaustif 1 4 1 0x5 0x8 0x9 0xA 2 20000 8
        tests/c/build/cm26_exhaustif 1 6 1 0x05 0x20 0x24 0x28 1 3000 12
        tests/c/build/cm26_exhaustif 2 7 2 0x05 0x40 0x48 0x50 0 400 14
        if tests/c/build/cm26_temoin 1 4 1 0x5 0x8 0x9 0xA 1 500 6 > /dev/null; then echo "negative witness passed"; exit 1; fi
        python3 $V/constantes.py
        python3 $V/classique.py
        python3 $V/eponge_domaines.py
