name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the C library and benchmark
      run: make -C sillage/c
    - name: Build the native test programs
      run: make -C tests/c all compression
    - name: C review checks
      run: mkdir -p resultats && tests/c/build/revue_c
    - name: Exact spectrum of H1-P / H2-P (Lemma 0)
      run: tests/c/build/h1p_fourier
    - name: VOLE prototype known-answer tests
      run: tests/c/build/vole_proto --kat
    - name: Short verifier fuzzing under ASan and UBSan
      run: |
        gcc -O1 -g -march=native -fopenmp -fsanitize=address,undefined -fno-sanitize-recover=all -I sillage/c -I tests/c \
            -o tests/c/build/vole_asan prototypes/vole/vole_proto.c sillage/c/commun.c sillage/c/brume512.c sillage/c/brume512_avx2.c -lm
        OMP_NUM_THREADS=1 tests/c/build/vole_asan --fuzz 300 1
    - name: Install the Python dependency
      run: python3 -m pip install -r requirements.txt
    - name: Generated tables are up to date
      run: make -C sillage/c tables && git diff --exit-code sillage/c/brume512_tables.h sillage/c/brume512_simd.h
    - name: Quick tests (KATs, TE mode, C and Python byte-for-byte conformance)
      run: |
        python3 -m tests.test_fonctionnel
        python3 -m tests.test_te
        python3 -m tests.test_c_impl
    - name: Fail if any quick-test check failed
      run: |
        # the tests record their checks in resultats/<name>.json and always exit 0
        if grep -H ': false' resultats/fonctionnel.json resultats/te.json resultats/c_impl.json; then exit 1; fi
    - name: BRUME-1024q prototype (v0.6 candidate, not part of the v0.5 battery)
      run: |
        B="-O3 -march=native -fopenmp -I sillage/c -I tests/c -I prototypes/brume_q/b1024"
        L="sillage/c/commun.c sillage/c/brume512.c sillage/c/brume512_avx2.c -lm"
        # 33 checks against the dense reference (kernels, sponge, tree, AEAD, parallel AEAD, portable kernel, 23 KATs)
        gcc $B prototypes/brume_q/b1024/brume1024.c $L -o tests/c/build/brume1024
        OMP_NUM_THREADS=2 tests/c/build/brume1024
        if grep -H ': false' resultats/brume1024.json; then exit 1; fi
        # second implementation written from SPEC.md alone: the 23 test vectors
        gcc -O2 -march=native -I sillage/c -I prototypes/brume_q/b1024 prototypes/brume_q/b1024/spec_ref.c $L -o tests/c/build/spec_ref
        tests/c/build/spec_ref prototypes/brume_q/b1024/kat_b1024.txt
        # C4 >= 28 certificate: structure of the reproduction package (completeness CNFs rebuilt, tree re-read)
        python3 prototypes/brume_q/sat/audit_c4_K28.py
        # quantum collision and preimage bounds of the sponge (SPONGE_QROM.md): counting lemma, exhaustive on small
        # models, with a negative witness that must fail; counts and witnessing; classical experiment; arithmetic
        V=prototypes/brume_q/b1024/cm26_verif
        gcc -O2 $V/exhaustif.c -o tests/c/build/cm26_exhaustif
        gcc -O2 -DTEMOIN $V/exhaustif.c -o tests/c/build/cm26_temoin
        tests/c/build/cm26_exhaustif 1 3 1 0x5 0x4 0x5 0x6 3 0 3
        tests/c/build/cm26_exhaustif 1 4 1 0x5 0x8 0x9 0xA 2 20000 8
        tests/c/build/cm26_exhaustif 1 6 1 0x05 0x20 0x24 0x28 1 3000 12
        tests/c/build/cm26_exhaustif 2 7 2 0x05 0x40 0x48 0x50 0 400 14
        if tests/c/build/cm26_temoin 1 4 1 0x5 0x8 0x9 0xA 1 500 6 > /dev/null; then echo "negative witness passed"; exit 1; fi
        python3 $V/constantes.py
        python3 $V/classique.py
        python3 $V/eponge_domaines.py
